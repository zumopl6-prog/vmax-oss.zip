name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o "vmax-oss.zip" -d vmax-oss
      - name: Commit
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add vmax-oss
          git commit -m "Unzip project"
          git push
